<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://kouryukaku.com/">
    <title>ページが見つかりません｜シティホテル甲隆閣</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
            background-color: #f8f6f1;
            color: #2d2a26;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }
        .box {
            text-align: center;
            max-width: 480px;
        }
        .code {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 72px;
            color: #c9a66b;
            line-height: 1;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 12px;
        }
        p {
            color: #7a746a;
            font-size: 15px;
            line-height: 1.8;
            margin-bottom: 28px;
        }
        a {
            display: inline-block;
            background: linear-gradient(135deg, #8b5a2b 0%, #6b4423 100%);
            color: #ffffff;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
        }
        a:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="box">
        <p class="code">404</p>
        <h1>お探しのページは見つかりませんでした</h1>
        <p>
            URLが変更されたか、ページが削除された可能性があります。<br>
            トップページからご確認ください。
        </p>
        <a href="/">トップページへ戻る</a>
    </div>
</body>
</html>
